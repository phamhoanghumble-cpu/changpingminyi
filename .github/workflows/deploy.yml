name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: env -u NODE_OPTIONS npm ci --no-audit --no-fund

      - name: 类型检查 + 构建
        run: env -u NODE_OPTIONS npm run build

      - name: 校验 Cloudflare 凭证
        run: |
          env -u NODE_OPTIONS npx wrangler whoami

      - name: 应用 D1 schema（幂等，重复运行安全）
        run: |
          env -u NODE_OPTIONS npx wrangler d1 execute jiancai-road \
            --remote \
            --file=./drizzle/init.sql \
            --persist

      - name: 部署到生产
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./
          command: deploy --env=""

      - name: 列出最近一次部署
        if: success()
        run: |
          env -u NODE_OPTIONS npx wrangler deployments list --name=changpingminyi | head -5